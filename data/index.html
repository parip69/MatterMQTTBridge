<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatterMQTTBridge</title>
  <style>
    body { background-color: #383737; color: white; font-family: sans-serif; padding: 20px; }
    .card { background-color: #8d8d8d; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    button { padding: 10px 15px; margin: 5px; cursor: pointer; border-radius: 5px; border: none; background-color: #5CB85C; color: white; }
    a { color: #5fe7f9; text-decoration: none; margin-right: 15px; }
  </style>
</head>
<body>
  <h1>MatterMQTTBridge</h1>
  
  <div class="card">
    <h3>Status</h3>
    <p>WLAN IP: <span id="ip">Lade...</span></p>
    <p>RSSI: <span id="rssi">Lade...</span></p>
    <p>MQTT Modus: <span id="mode">Lade...</span></p>
    <p>MQTT Status: <span id="mqtt">Lade...</span></p>
    <p>Root Topic: <span id="root">Lade...</span></p>
    <p>Version: <span id="version">Lade...</span></p>
  </div>

  <div class="card">
    <h3>Trigger Senden</h3>
    <button onclick="sendTrigger(1)">Trigger 1 senden</button>
    <button onclick="sendTrigger(2)">Trigger 2 senden</button>
    <button onclick="sendTrigger(3)">Trigger 3 senden</button>
    <button onclick="sendTrigger(4)">Trigger 4 senden</button>
    <button onclick="sendTrigger(5)">Trigger 5 senden</button>
  </div>

  <div>
    <a href="/settings.html">Settings</a>
    <a href="/update">OTA Update</a>
  </div>

  <script>
    function updateStatus() {
      fetch('/api/bridge/status')
        .then(res => res.json())
        .then(data => {
          if(data.ok) {
            document.getElementById('ip').innerText = data.ip;
            document.getElementById('rssi').innerText = data.rssi + ' dBm';
            document.getElementById('mode').innerText = data.mode;
            document.getElementById('mqtt').innerText = data.mqtt;
            document.getElementById('root').innerText = data.root;
            document.getElementById('version').innerText = data.version;
          }
        }).catch(err => console.error(err));
    }
    
    function sendTrigger(pin) {
      fetch('/api/bridge/trigger?pin=' + pin)
        .then(res => res.json())
        .then(data => {
          if(data.ok) alert('Trigger ' + pin + ' gesendet!\nTopic: ' + data.topic + '\nPayload: ' + data.payload);
          else alert('Fehler: ' + data.error);
        }).catch(err => alert('Fehler beim Senden: ' + err));
    }
    
    updateStatus();
    setInterval(updateStatus, 5000);
  </script>
</body>
</html>

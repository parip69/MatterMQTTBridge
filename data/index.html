<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatterMQTTBridge</title>
    <style>
        body { background-color: #383737; color: white; font-family: sans-serif; padding: 20px; text-align: center; }
        .card { background-color: #8d8d8d; padding: 15px; border-radius: 8px; margin-bottom: 20px; max-width: 400px; margin-left: auto; margin-right: auto; text-align: left; }
        .card h3 { text-align: center; margin-top: 0; }
        button { background-color: #4CAF50; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; margin: 5px; font-size: 16px; width: 100%; box-sizing: border-box; }
        button:hover { background-color: #45a049; }
        button.trigger-btn { width: auto; }
        .nav-links { margin-bottom: 20px; }
        a { color: #81D4FA; text-decoration: none; font-weight: bold; margin: 0 10px; }
        a:hover { text-decoration: underline; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        hr { border: 1px solid #777; margin: 15px 0; }
        .trigger-container { text-align: center; }
        .diag-log { background:#3a3a3a; border:2px solid #8b0000; border-radius:4px; padding:8px; height:220px; overflow-y:auto; font-family:monospace; font-size:12px; text-align:left; color:#e0e0e0; }
        .btn-sm { width:auto; padding:5px 12px; font-size:13px; }
    </style>
</head>
<body>
    <h1>MatterMQTTBridge</h1>
    
    <div class="nav-links">
        <a href="/update">🔄 OTA Update</a>
        <a href="#" onclick="restartBridge()">🔄 Neustart</a>
    </div>

    <div class="card">
        <h3>System Status</h3>
        <p><b>WLAN IP:</b> <span id="val_ip">...</span></p>
        <p><b>Hostname:</b> <span id="val_hostname">...</span> &nbsp;|&nbsp; <a id="val_mdns_link" href="#" target="_blank"><span id="val_mdns">...</span></a></p>
        <p><b>RSSI:</b> <span id="val_rssi">...</span> dBm</p>
        <p><b>MQTT Modus:</b> <span id="val_mode">...</span></p>
        <p><b>MQTT Status:</b> <span id="val_mqtt">...</span></p>
        <p><b>Root Topic:</b> <span id="val_root">...</span></p>
        <p><b>Firmware Version:</b> <span id="val_version">...</span></p>
    </div>

    <div class="card">
        <h3>Bridge Trigger</h3>
        <div class="trigger-container">
            <button class="trigger-btn" onclick="triggerPin(1)">Trigger 1</button>
            <button class="trigger-btn" onclick="triggerPin(2)">Trigger 2</button>
            <button class="trigger-btn" onclick="triggerPin(3)">Trigger 3</button>
            <button class="trigger-btn" onclick="triggerPin(4)">Trigger 4</button>
            <button class="trigger-btn" onclick="triggerPin(5)">Trigger 5</button>
        </div>
        <hr>
        <label>Triggernummer (1-99):</label>
        <input type="number" id="customTriggerPin" min="1" max="99" value="6">
        <button onclick="triggerCustomPin()">Trigger senden</button>
    </div>

    <div class="card">
        <h3>MQTT Monitor</h3>
        <h3>Diagnose / Live-Log</h3>
        <div id="diagLog" class="diag-log"></div>
        <div style="margin-top:8px; display:flex; flex-wrap:wrap; gap:4px;">
            <button class="btn-sm" onclick="clearDiagLog()">Log leeren</button>
            <button class="btn-sm" onclick="triggerSilent(1)">Test Aktion 1</button>
            <button class="btn-sm" onclick="triggerSilent(2)">Test Aktion 2</button>
            <button class="btn-sm" onclick="triggerSilent(3)">Test Aktion 3</button>
        </div>
    </div>

    <div class="card">
        <h3>Einstellungen</h3>
        <form id="settingsForm" onsubmit="saveSettings(event)">
            <h4>WLAN</h4>
            <label>SSID:</label>
            <input type="text" name="ssid" id="ssid">
            <label>Passwort:</label>
            <input type="password" name="password" id="password" placeholder="Nur bei Änderung ausfüllen">
            <label>Hostname:</label>
            <input type="text" name="hostname" id="hostname">
            
            <hr>
            <h4>MQTT</h4>
            <label>MQTT Modus:</label>
            <select name="mqtt_mode" id="mqtt_mode">
                <option value="off">Aus</option>
                <option value="broker">Broker</option>
                <option value="client">Client</option>
            </select>
            <label>MQTT Host:</label>
            <input type="text" name="mqttServer" id="mqttServer">
            <label>MQTT Port:</label>
            <input type="text" name="mqtt_port" id="mqtt_port">
            <label>MQTT Benutzer:</label>
            <input type="text" name="mqttUsername" id="mqttUsername">
            <label>MQTT Passwort:</label>
            <input type="password" name="mqttPassword" id="mqttPassword" placeholder="Nur bei Änderung ausfüllen">
            <label>MQTT Root Topic:</label>
            <input type="text" name="mqttRootTopic" id="mqttRootTopic">
            
            <hr>
            <h4>Web</h4>
            <label>Admin Passwort:</label>
            <input type="password" name="passwordAdmin" id="passwordAdmin" placeholder="Nur bei Änderung ausfüllen">

            <button type="submit" id="saveBtn">Einstellungen speichern</button>
        </form>
        <div id="saveMsg" style="color: #4CAF50; font-weight: bold; margin-top: 10px; text-align: center;"></div>
    </div>

    <script>
        function loadStatus() {
            fetch('/api/bridge/status')
                .then(res => res.json())
                .then(data => {
                    if (data.ok) {
                        document.getElementById('val_ip').innerText = data.ip;
                        document.getElementById('val_rssi').innerText = data.rssi;
                        document.getElementById('val_mode').innerText = data.mode;
                        document.getElementById('val_mqtt').innerText = data.mqtt;
                        document.getElementById('val_root').innerText = data.root;
                        document.getElementById('val_version').innerText = data.version;
                        if (data.hostname) document.getElementById('val_hostname').innerText = data.hostname;
                        if (data.mdns) {
                            document.getElementById('val_mdns').innerText = data.mdns;
                            document.getElementById('val_mdns_link').href = 'http://' + data.mdns;
                        }
                    }
                })
                .catch(err => console.error("Status error:", err));
        }

        function loadSettings() {
            fetch('/api/settings')
                .then(res => res.json())
                .then(data => {
                    if(data.ssid) document.getElementById('ssid').value = data.ssid;
                    if(data.hostname) document.getElementById('hostname').value = data.hostname;
                    if(data.mqtt_mode) document.getElementById('mqtt_mode').value = data.mqtt_mode;
                    if(data.mqttServer) document.getElementById('mqttServer').value = data.mqttServer;
                    if(data.mqtt_port) document.getElementById('mqtt_port').value = data.mqtt_port;
                    if(data.mqttUsername) document.getElementById('mqttUsername').value = data.mqttUsername;
                    if(data.mqttRootTopic) document.getElementById('mqttRootTopic').value = data.mqttRootTopic;
                })
                .catch(err => console.error("Settings error:", err));
        }

        function triggerPin(pin) {
            fetch('/api/bridge/trigger?pin=' + pin)
                .then(res => res.json())
                .then(data => {
                    if (data.ok) {
                        alert("Trigger " + pin + " gesendet\nTopic: " + data.topic + "\nPayload: " + data.payload);
                    } else {
                        alert("Fehler: " + data.error);
                    }
                })
                .catch(err => alert("Trigger fehlgeschlagen: " + err));
        }

        function triggerCustomPin() {
            let pin = document.getElementById("customTriggerPin").value;
            triggerPin(pin);
        }

        function saveSettings(e) {
            e.preventDefault();
            const form = document.getElementById('settingsForm');
            const data = new URLSearchParams(new FormData(form));
            const saveBtn = document.getElementById('saveBtn');
            const saveMsg = document.getElementById('saveMsg');
            
            saveBtn.disabled = true;
            saveBtn.innerText = "Speichere...";
            saveMsg.innerText = "";

            fetch('/save_settings', {
                method: 'POST',
                body: data,
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                }
            })
            .then(res => res.text())
            .then(text => {
                saveMsg.innerText = text;
            })
            .catch(err => {
                saveMsg.style.color = "red";
                saveMsg.innerText = "Fehler beim Speichern: " + err;
                saveBtn.disabled = false;
                saveBtn.innerText = "Einstellungen speichern";
            });
        }

        function restartBridge() {
            if(confirm("Bridge wirklich neu starten?")) {
                fetch('/api/restart')
                    .then(res => res.text())
                    .then(text => alert(text))
                    .catch(err => alert("Fehler: " + err));
            }
        }

        // ===== MQTT Monitor =====
        // ===== Diagnose-Log =====
        function clearDiagLog() {
            document.getElementById('diagLog').innerHTML = '';
        }

        function appendLogLine(text) {
            const log = document.getElementById('diagLog');
            const row = document.createElement('div');
            const now = new Date();
            const ts = now.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
            const dt = now.toLocaleDateString('de-DE');
            row.textContent = '[' + ts + ' - ' + dt + ']: ' + text;
            if      (text.startsWith('TX'))                                   row.style.color = '#4CAF50';
            else if (text.startsWith('RX'))                                   row.style.color = '#81D4FA';
            else if (text.startsWith('WLAN') || text.startsWith('mDNS'))      row.style.color = '#FFD700';
            else if (text.startsWith('OTA'))                                  row.style.color = '#FF9800';
            else if (text.startsWith('MQTT') || text.startsWith('TestPin'))   row.style.color = '#CE93D8';
            log.appendChild(row);
            log.scrollTop = log.scrollHeight;
            while (log.children.length > 50) log.removeChild(log.firstChild);
        }

        function triggerSilent(pin) {
            fetch('/api/bridge/trigger?pin=' + pin)
                .then(res => res.json())
                .then(data => {
                    if (data.ok) appendLogLine('TX  ' + data.topic + '  ->  ' + data.payload);
                    else appendLogLine('Trigger ' + pin + ' fehlgeschlagen: ' + (data.error || 'unbekannt'));
                })
                .catch(err => appendLogLine('Trigger ' + pin + ' Fehler: ' + err));
        }

        function loadLogHistory() {
            fetch('/api/bridge/log')
                .then(res => res.json())
                .then(data => { if (data.log) data.log.forEach(line => appendLogLine(line)); })
                .catch(() => {});
        }

        (function initDiagLog() {
            const src = new EventSource('/events');
            src.addEventListener('log', function(e) { appendLogLine(e.data); });
        })();

        window.onload = () => {
            loadStatus();
            loadSettings();
            loadLogHistory();
            setInterval(loadStatus, 5000);
        };
    </script>
</body>
</html>

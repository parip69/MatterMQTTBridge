<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>%HOSTNAME%</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="stylesheet" href="/bootstrap.min.css">
  <style>
    body { background-color: #2c2c2c; color: #e0e0e0; }
    .card { background-color: #3c3c3c; border: 1px solid #555; }
    .card-header { background-color: #444; border-bottom: 1px solid #555; }
    .badge-online  { background-color: #28a745; }
    .badge-offline { background-color: #dc3545; }
    .badge-reconnecting { background-color: #ffc107; color: #333; }
    .badge-disabled { background-color: #6c757d; }
    #logBox { background-color: #1e1e1e; color: #aaffaa; font-size: 12px;
              height: 200px; overflow-y: auto; padding: 8px; border-radius: 4px;
              font-family: monospace; }
    .nav-btn { margin-right: 8px; margin-bottom: 8px; }
    .status-label { font-weight: bold; min-width: 120px; display: inline-block; }
    #notifyBox { background-color: #1e1e1e; color: #ffdd99; font-size: 12px;
                 height: 120px; overflow-y: auto; padding: 6px; border-radius: 4px;
                 font-family: monospace; margin-top: 8px; }
  </style>
</head>
<body>
<div class="container py-3">
  <!-- Header -->
  <div class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h5 class="mb-0">🌉 MatterMQTTBridge – <span id="hostLabel">%HOSTNAME%</span></h5>
      <small id="clockLabel" class="text-muted">%UHRZEIT_DATUM%</small>
    </div>
    <div class="card-body">
      <div class="row">
        <div class="col-sm-6">
          <p class="mb-1"><span class="status-label">MQTT-Modus:</span>
            <span id="mqttMode" class="badge badge-secondary">–</span>
          </p>
          <p class="mb-1"><span class="status-label">MQTT-Status:</span>
            <span id="mqttStatus" class="badge badge-secondary">–</span>
          </p>
          <p class="mb-1"><span class="status-label">WiFi-Qualität:</span>
            <span id="wifiQ">%WIFIQUALITY%</span>%
          </p>
        </div>
        <div class="col-sm-6">
          <p class="mb-1"><span class="status-label">Version:</span>
            <small>%VERSIONINFO%</small>
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- Trigger-Buttons -->
  <div class="card mb-3">
    <div class="card-header">⚡ Bridge-Trigger senden</div>
    <div class="card-body">
      <div id="triggerBtns">
        <button class="btn btn-sm btn-warning nav-btn" onclick="sendTrigger(1)">Trigger 1</button>
        <button class="btn btn-sm btn-warning nav-btn" onclick="sendTrigger(2)">Trigger 2</button>
        <button class="btn btn-sm btn-warning nav-btn" onclick="sendTrigger(3)">Trigger 3</button>
        <button class="btn btn-sm btn-warning nav-btn" onclick="sendTrigger(4)">Trigger 4</button>
        <button class="btn btn-sm btn-warning nav-btn" onclick="sendTrigger(5)">Trigger 5</button>
      </div>
      <div id="notifyBox"></div>
    </div>
  </div>

  <!-- Log -->
  <div class="card mb-3">
    <div class="card-header">📋 System-Log</div>
    <div class="card-body p-2">
      <div id="logBox">%LOGMESSAGES%</div>
    </div>
  </div>

  <!-- Navigation -->
  <div class="text-center">
    <a href="/settings" class="btn btn-sm btn-secondary nav-btn">⚙️ Einstellungen</a>
    <a href="/update" class="btn btn-sm btn-info nav-btn">🔄 OTA-Update</a>
    <a href="/reboot" class="btn btn-sm btn-danger nav-btn"
       onclick="return confirm('Gerät wirklich neu starten?')">🔁 Neustart</a>
  </div>
</div>

<script>
// ===== SSE Live-Updates =====
const evtSrc = new EventSource('/events');

evtSrc.addEventListener('mqtt_status', e => {
  const el = document.getElementById('mqttStatus');
  el.textContent = e.data;
  el.className = 'badge badge-' + (e.data === 'online' ? 'online' : e.data === 'offline' ? 'offline' : e.data === 'reconnecting' ? 'reconnecting' : 'disabled');
});

evtSrc.addEventListener('message', e => {
  appendNotify(e.data);
});

evtSrc.addEventListener('log', e => {
  appendLog(e.data);
});

function appendLog(msg) {
  const box = document.getElementById('logBox');
  const line = document.createElement('div');
  line.textContent = msg;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}

function appendNotify(msg) {
  const box = document.getElementById('notifyBox');
  const line = document.createElement('div');
  line.textContent = new Date().toLocaleTimeString('de-DE') + ' ' + msg;
  box.insertBefore(line, box.firstChild);
}

// ===== Bridge-Status laden =====
function loadStatus() {
  fetch('/api/bridge/status')
    .then(r => r.json())
    .then(d => {
      const modeEl = document.getElementById('mqttMode');
      modeEl.textContent = d.mqtt_mode || '-';
      modeEl.className = 'badge badge-' + (d.mqtt_mode === 'off' ? 'disabled' : 'secondary');
      const stEl = document.getElementById('mqttStatus');
      stEl.textContent = d.mqtt_status || '-';
      stEl.className = 'badge badge-' + (d.mqtt_status === 'online' ? 'online' : d.mqtt_status === 'offline' ? 'offline' : 'reconnecting');
    }).catch(() => {});
}

// ===== Trigger senden =====
function sendTrigger(n) {
  const fd = new FormData();
  fd.append('n', n);
  fetch('/api/bridge/trigger', { method: 'POST', body: fd })
    .then(r => r.json())
    .then(d => { appendNotify('Trigger ' + n + ' gesendet: ' + (d.ok ? '✅' : '❌')); })
    .catch(err => { appendNotify('Fehler: ' + err); });
}

// ===== UI-Heartbeat =====
setInterval(() => {
  fetch('/ui-alive').catch(() => {});
  loadStatus();
}, 10000);

loadStatus();
</script>
</body>
</html>

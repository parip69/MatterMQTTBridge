<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Einstellungen – %HOSTNAME%</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="stylesheet" href="/bootstrap.min.css">
  <style>
    body { background-color: #2c2c2c; color: #e0e0e0; }
    .card { background-color: #3c3c3c; border: 1px solid #555; margin-bottom: 16px; }
    .card-header { background-color: #444; border-bottom: 1px solid #555; font-weight: bold; }
    .form-control { background-color: #2a2a2a; color: #e0e0e0; border-color: #555; }
    .form-control:focus { background-color: #333; color: #fff; border-color: #888; }
    label { color: #bbb; }
    .btn-save { min-width: 120px; }
  </style>
</head>
<body>
<div class="container py-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4>⚙️ Einstellungen – %HOSTNAME%</h4>
    <a href="/" class="btn btn-sm btn-secondary">← Zurück</a>
  </div>

  <!-- Alle Einstellungen in einem Formular -->
  <form action="/settings" method="get">

    <!-- WLAN -->
    <div class="card">
      <div class="card-header">📶 WLAN</div>
      <div class="card-body">
        <div class="form-group">
          <label>SSID</label>
          <input type="text" class="form-control" name="ssid" value="%WIFI_SSID%">
        </div>
        <div class="form-group">
          <label>Passwort</label>
          <input type="password" class="form-control" name="password" value="%WIFI_PASSWORD%"
                 placeholder="leer lassen um nicht zu ändern">
        </div>
        <div class="form-group">
          <label>Hostname</label>
          <input type="text" class="form-control" name="hostname" value="%HOSTNAME%">
        </div>
        <button type="submit" name="btnSaveSettings" class="btn btn-primary btn-save">💾 Speichern &amp; Neustart</button>
      </div>
    </div>

    <!-- MQTT -->
    <div class="card">
      <div class="card-header">📡 MQTT</div>
      <div class="card-body">
        <div class="form-group">
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="mqttMode" id="modeOff" value="off">
            <label class="form-check-label" for="modeOff">Aus</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="mqtt_isBroker" id="modeBroker" value="on" %isbroker_checked%>
            <label class="form-check-label" for="modeBroker">Broker</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="mqtt_isClient" id="modeClient" value="on" %isclient_checked%>
            <label class="form-check-label" for="modeClient">Client</label>
          </div>
        </div>
        <div class="form-group">
          <label>Broker-Adresse (Client-Modus)</label>
          <input type="text" class="form-control" name="mqttServer" value="%MQTT_SERVER%" placeholder="z.B. 192.168.1.100">
        </div>
        <div class="form-group">
          <label>Port</label>
          <input type="number" class="form-control" name="mqtt_port" value="%MQTT_PORT%" min="1" max="65535">
        </div>
        <div class="form-group">
          <label>Benutzername</label>
          <input type="text" class="form-control" name="mqttUsername" value="%MQTT_USERNAME%">
        </div>
        <div class="form-group">
          <label>Passwort</label>
          <input type="password" class="form-control" name="mqttPassword" value="%MQTT_PASSWORD%">
        </div>
        <div class="form-group">
          <label>Root-Topic</label>
          <input type="text" class="form-control" name="mqttRootTopic" value="%MQTT_ROOTTOPIC%" placeholder="MatterMQTTBridge">
        </div>
        <div class="form-group">
          <label>Keep-Alive (Sekunden)</label>
          <input type="number" class="form-control" name="mqtt_keepAlive" value="%MQTT_KEEPALIVE%" min="5" max="300">
        </div>
        <button type="submit" name="btnSaveSettings" class="btn btn-primary btn-save">💾 Speichern &amp; Neustart</button>
      </div>
    </div>

    <!-- NTP -->
    <div class="card">
      <div class="card-header">🕐 Zeit (NTP)</div>
      <div class="card-body">
        <div class="form-group">
          <label>NTP-Server</label>
          <input type="text" class="form-control" name="ntpServer" value="%NTP_SERVER%" placeholder="pool.ntp.org">
        </div>
        <div class="form-group">
          <label>Zeitzone (POSIX)</label>
          <input type="text" class="form-control" name="timezone" value="%NTP_OFFSET_TIME%" placeholder="CET-1CEST,M3.5.0,M10.5.0/3">
          <small class="text-muted">z.B. CET-1CEST,M3.5.0,M10.5.0/3 für Deutschland</small>
        </div>
        <button type="submit" name="btnSaveSettings" class="btn btn-primary btn-save">💾 Speichern &amp; Neustart</button>
      </div>
    </div>

    <!-- WiFi-Stabilität -->
    <div class="card">
      <div class="card-header">📶 WiFi-Stabilität</div>
      <div class="card-body">
        <div class="form-group">
          <label>RSSI Disconnect-Schwelle (dBm, Standard: -85)</label>
          <input type="number" class="form-control" name="wifiRssiDisconnectThreshold" value="%WIFI_RSSI_DISCONNECT%" min="-100" max="-10">
        </div>
        <div class="form-group">
          <label>Roam-Verbesserung (dB)</label>
          <input type="number" class="form-control" name="wifiRoamImproveDb" value="%WIFI_ROAM_IMPROVE%" min="0" max="20">
        </div>
        <div class="form-group">
          <label>Roam Min-RSSI (dBm)</label>
          <input type="number" class="form-control" name="wifiRoamMinRssi" value="%WIFI_ROAM_MIN_RSSI%" min="-100" max="-30">
        </div>
        <button type="submit" name="btnSaveSettings" class="btn btn-primary btn-save">💾 Speichern &amp; Neustart</button>
      </div>
    </div>

    <!-- Passwort -->
    <div class="card">
      <div class="card-header">🔐 Zugangsschutz</div>
      <div class="card-body">
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" name="enablePassword" id="chkPw" value="on" %password_enabled_checked%>
          <label class="form-check-label" for="chkPw">Passwortschutz aktivieren</label>
        </div>
        <div class="form-group">
          <label>Passwort</label>
          <input type="password" class="form-control" name="passwordSetup" value="" placeholder="leer = nicht ändern">
          <small class="text-muted">%PASSWORD_SETUP%</small>
        </div>
        <button type="submit" name="btnSaveSettings" class="btn btn-primary btn-save">💾 Speichern &amp; Neustart</button>
      </div>
    </div>

  </form>

  <!-- Gefährliche Aktionen -->
  <div class="card border-danger">
    <div class="card-header text-danger">⚠️ Gefährliche Aktionen</div>
    <div class="card-body">
      <a href="/factoryReset?btnFactoryReset=1" class="btn btn-sm btn-danger mr-2"
         onclick="return confirm('Wirklich alle Einstellungen zurücksetzen?')">
        🗑️ Werksreset
      </a>
      <a href="/reboot" class="btn btn-sm btn-warning"
         onclick="return confirm('Gerät neu starten?')">
        🔁 Neustart
      </a>
    </div>
  </div>

</div>
</body>
</html>

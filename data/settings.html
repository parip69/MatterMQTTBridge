<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatterMQTTBridge Settings</title>
  <style>
    body { background-color: #383737; color: white; font-family: sans-serif; padding: 20px; }
    .card { background-color: #8d8d8d; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    label { display: inline-block; width: 120px; margin-bottom: 5px; }
    input, select { margin-bottom: 10px; padding: 5px; width: 200px; }
    button { padding: 10px 15px; cursor: pointer; border-radius: 5px; border: none; background-color: #5CB85C; color: white; }
    a { color: #5fe7f9; text-decoration: none; margin-right: 15px; }
  </style>
</head>
<body>
  <h1>Settings</h1>
  <form id="settingsForm" action="/settings" method="GET">
    
    <div class="card">
      <h3>WLAN</h3>
      <label>SSID:</label> <input type="text" name="ssid" value="" placeholder="Deine SSID"><br>
      <label>Passwort:</label> <input type="password" name="password" value="" placeholder="Dein WLAN Passwort"><br>
      <label>Hostname:</label> <input type="text" name="hostname" value="MatterMQTTBridge"><br>
    </div>

    <div class="card">
      <h3>MQTT</h3>
      <label>Modus:</label>
      <select name="mqttMode">
        <option value="off">Aus</option>
        <option value="broker">Broker</option>
        <option value="client">Client</option>
      </select><br>
      <input type="hidden" name="mqtt_isBroker" id="mqttBrokerHidden" value="false">
      <input type="hidden" name="mqtt_isClient" id="mqttClientHidden" value="false">
      
      <label>Broker Host:</label> <input type="text" name="mqttServer" value=""><br>
      <label>Port:</label> <input type="number" name="mqtt_port" value="1883"><br>
      <label>Benutzer:</label> <input type="text" name="mqttUsername" value=""><br>
      <label>Passwort:</label> <input type="password" name="mqttPassword" value=""><br>
      <label>Root Topic:</label> <input type="text" name="mqttRootTopic" value="fingerprint"><br>
    </div>

    <div class="card">
      <h3>Web</h3>
      <label>Admin Passwort:</label> <input type="password" name="passwordAdmin" value=""><br>
    </div>

    <button type="button" onclick="saveSettings()">Speichern</button>
    <a href="/">Zurück</a>
    <a href="/update">OTA Update</a>
  </form>

  <script>
    function saveSettings() {
      const mode = document.querySelector('select[name="mqttMode"]').value;
      if (mode === 'broker') {
        document.getElementById('mqttBrokerHidden').value = 'on';
      } else if (mode === 'client') {
        document.getElementById('mqttClientHidden').value = 'on';
      }
      alert('Speichern-Logik noch einzubinden - Formular absenden...');
      document.getElementById('settingsForm').submit();
    }
  </script>
</body>
</html>

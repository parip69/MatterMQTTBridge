<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Login</title>
  <link rel="icon" type="image/svg+xml" href="/icon-bridge.svg">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #22c55e;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 420px;
      margin: 0;
    }

    .login-container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 18px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .login-title {
      color: var(--accent);
      text-align: center;
      margin: 0 0 16px;
      font-weight: 700;
    }

    label {
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 6px;
      display: block;
    }

    .form-control {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 10px 12px;
      font-size: 14px;
      box-shadow: none;
    }

    .form-control:focus {
      border-color: var(--accent);
      outline: none;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15);
    }

    .btn-primary {
      background: var(--ok);
      border: none;
      border-radius: 10px;
      color: #00150a;
      font-weight: 700;
      padding: 10px 18px;
      margin-top: 10px;
    }

    .btn-primary:hover {
      background: #1eb455;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .text-center {
      text-align: center;
    }

    .error {
      margin-top: 12px;
      color: #fecaca;
      text-align: center;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="login-container">
      <h2 class="login-title">Login</h2>
      <form action="/login" method="post">
        <div class="form-group">
          <label for="password">Passwort:</label>
          <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <div class="form-group text-center">
          <button type="submit" class="btn btn-primary">Einloggen</button>
        </div>
      </form>
      <p class="error" id="loginError" style="display:none">Passwort falsch</p>
    </div>
  </div>

  <script>
    if (location.search.indexOf("error=1") >= 0) {
      document.getElementById("loginError").style.display = "block";
    }
  </script>
</body>

</html>

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html



; 📋 DEBUG-LEVEL KONFIGURATION
; =====================================
; LOGGING              : 0 = Silent, 1 = Debug-Ausgaben (global)
; BROKER_DEBUG_LEVEL   : Konstanten aus ESPAsyncMQTTBroker enum
;   DEBUG_NONE      → Keine Ausgaben = 0 
;   DEBUG_ERROR     → Nur Fehler = 1 
;   DEBUG_WARNING   → Warnungen + Fehler = 2
;   DEBUG_INFO      → Info + Warnungen + Fehler = 3
;   DEBUG_DEBUG     → Alles (verbose) = 4
; =====================================

[platformio]
default_envs = max
;default_envs = min oder max

; =============================================================
; Nur alles maximal – Release optimiert aber max programm
; Aufruf: pio run -e max
; =============================================================
[env:max]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
build_type = release
;monitor_encoding = utf-8

build_flags =
	-D USE_TEDEE=1
	-D USE_NUKI=0
	-D USE_DHT=1
	-D USE_TELEGRAM=1
	-D USE_TELEGRAM_CMD=1
	-D USE_DOWNLOAD_UPLOAD=1
	-D USE_MQTT_BROKER=1
	-D USE_MQTT_CLIENT=1
	-D LOGGING=1
	-D DIAG_LOG_ENABLED=1
	;-D FINGERPRINT_DEBUG
	-D BROKER_DEBUG_LEVEL=DEBUG_NONE
	-D BUILD_TRIGGER=\"${PIOENV}\"
	-D ELEGANTOTA_USE_ASYNC_WEBSERVER
	-std=gnu++17
	-Os
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
	-DNDEBUG
	-Wall
	-Wextra
	-Wno-missing-field-initializers
	-Wno-deprecated-declarations
	-Wno-format
lib_deps = 
	https://github.com/parip69/ESPAsyncMQTTBroker.git
	https://github.com/ESP32Async/ESPAsyncWebServer.git
	marvinroger/AsyncMqttClient
	https://github.com/adafruit/Adafruit-Fingerprint-Sensor-Library.git
	intrbiz/Crypto@^1.0.0
	bblanchon/ArduinoJson@^7.4.0
	https://github.com/ESP32Async/AsyncTCP.git
	https://github.com/beegee-tokyo/DHTesp.git
	ayushsharma82/ElegantOTA@^3.1.7
lib_ldf_mode = deep+
lib_compat_mode = strict
lib_ignore = AsyncTCP_RP2040W
extra_scripts =
	pre:update_version_in_code.py
	post:update_backup_projekt_and_firmware.py

